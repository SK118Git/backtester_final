[package]
name = "backtester_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
polars = { version = "0.53", features = [
    "lazy",              # LazyFrame + expressions
    "parquet",           # scan_parquet / sink_parquet / ParquetWriter
    "csv",               # scan_csv
    "dtype-datetime",    # Datetime type for ts
    "temporal",          # datetime ops
    "new_streaming",
    "polars-ops",
    "is_between",
    "round_series",
] }
serde = { version = "1", features = ["derive"]}
serde_json = "1"

sha2 = "0.10"
hex = "0.4"